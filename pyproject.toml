[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quiz-assistant-poc"
version = "0.2.1"
description = "Windows quiz assistant with in-memory multi-frame analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "keyring>=25.6,<26",
  "mss>=10.0,<11",
  "openai>=2.16,<3",
  "Pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "PySide6>=6.10,<6.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
]

[project.scripts]
quiz-assistant = "quiz_assistant.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
