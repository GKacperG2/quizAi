<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symulator quizu — Asystent PoC</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef2f7; color: #172033; }
    header { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 18px 28px; background: #172033; color: white; }
    header strong { font-size: 18px; }
    #timer { padding: 8px 12px; border-radius: 999px; background: #253552; font-variant-numeric: tabular-nums; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; max-width: 1180px; margin: 28px auto; padding: 0 20px 280px; }
    .card { background: white; border: 1px solid #d9e1ec; border-radius: 18px; box-shadow: 0 12px 34px rgba(26, 40, 66, .08); }
    .quiz { padding: 30px; min-height: 720px; }
    .eyebrow { margin: 0 0 10px; color: #2563eb; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 14px; font-size: 27px; line-height: 1.25; }
    .context { color: #526079; line-height: 1.65; }
    fieldset { margin: 26px 0; padding: 0; border: 0; }
    label.option { display: flex; gap: 12px; margin: 11px 0; padding: 16px; border: 1px solid #cfdae9; border-radius: 12px; cursor: pointer; }
    label.option:hover { border-color: #4f86e8; background: #f5f8ff; }
    textarea { width: 100%; min-height: 120px; padding: 14px; border: 1px solid #bdc9da; border-radius: 12px; font: inherit; resize: vertical; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700; cursor: pointer; }
    button.primary { background: #2563eb; color: white; }
    button.secondary { background: #e7edf7; color: #172033; }
    aside { position: sticky; top: 92px; align-self: start; overflow: hidden; }
    aside h2 { margin: 0; padding: 18px 20px; border-bottom: 1px solid #d9e1ec; font-size: 16px; }
    #log { height: 500px; overflow: auto; margin: 0; padding: 14px 18px; background: #0d1524; color: #d8e6ff; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; }
    .aside-actions { padding: 12px; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { position: static; } }
  </style>
</head>
<body>
  <header>
    <strong>Lokalny symulator quizu</strong>
    <span id="timer">00:00</span>
  </header>
  <main>
    <section class="card quiz">
      <p id="counter">Pytanie testowe 1</p>
      <label for="scenario">Typ zadania testowego:</label>
      <select id="scenario"></select>
      <h1 id="question">Która zależność definiuje rezystancję elektryczną?</h1>
      <p class="context">To lokalna, fikcyjna treść służąca wyłącznie do sprawdzenia kadru, fokusu, przewijania oraz klikania pod panelem.</p>
      <fieldset id="answers">
        <label class="option"><input type="radio" name="answer"> <span>A. R = U · I</span></label>
        <label class="option"><input type="radio" name="answer"> <span>B. R = U / I</span></label>
        <label class="option"><input type="radio" name="answer"> <span>C. R = I / U</span></label>
        <label class="option"><input type="radio" name="answer"> <span>D. R = U + I</span></label>
      </fieldset>
      <label for="openAnswer"><strong>Kontrolne pole odpowiedzi otwartej</strong></label>
      <textarea id="openAnswer" placeholder="Kliknij tutaj i sprawdź, czy po pokazaniu panelu nadal można pisać…"></textarea>
      <div class="actions">
        <button class="primary" id="next">Następne pytanie</button>
        <button class="secondary" id="scrollTest">Przewiń niżej</button>
      </div>
    </section>
    <aside class="card">
      <h2>Rejestr zdarzeń strony</h2>
      <pre id="log"></pre>
      <div class="aside-actions"><button class="secondary" id="clear">Wyczyść rejestr</button></div>
    </aside>
  </main>
  <script src="scenarios.js"></script>
  <script>
    const logNode = document.querySelector('#log');
    const startedAt = performance.now();
    let questionNumber = 1;
    const log = (name, details = '') => {
      const elapsed = ((performance.now() - startedAt) / 1000).toFixed(3);
      logNode.textContent += `[${elapsed}s] ${name}${details ? ` · ${details}` : ''}\n`;
      logNode.scrollTop = logNode.scrollHeight;
    };
    window.addEventListener('focus', () => log('focus'));
    window.addEventListener('blur', () => log('blur'));
    document.addEventListener('visibilitychange', () => log('visibilitychange', document.visibilityState));
    document.addEventListener('wheel', event => log('wheel', `deltaY=${Math.round(event.deltaY)}`), { passive: true });
    document.addEventListener('mousedown', event => log('mousedown', `${event.target.tagName.toLowerCase()} @ ${event.clientX},${event.clientY}`));
    document.addEventListener('keydown', event => log('keydown', event.key));
    document.querySelector('#clear').addEventListener('click', () => { logNode.textContent = ''; log('log cleared'); });
    document.querySelector('#scrollTest').addEventListener('click', () => window.scrollBy({ top: 420, behavior: 'smooth' }));
    const picker = document.querySelector('#scenario');
    scenarios.forEach((item, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = item.type;
      picker.append(option);
    });
    function renderScenario(index) {
      const scenario = scenarios[index];
      questionNumber = index + 1;
      document.querySelector('#counter').textContent = 'Pytanie testowe ' + questionNumber + ' / ' + scenarios.length;
      document.querySelector('#question').textContent = scenario.question;
      document.querySelector('#answers').innerHTML = scenario.html; // Static local fixtures only, never API output.
      document.querySelector('#openAnswer').value = '';
      picker.value = index;
      log('questionchange', String(questionNumber));
    }
    picker.addEventListener('change', () => renderScenario(Number(picker.value)));
    document.querySelector('#next').addEventListener('click', () => renderScenario(questionNumber % scenarios.length));
    renderScenario(0);
    window.setInterval(() => {
      const seconds = Math.floor((performance.now() - startedAt) / 1000);
      document.querySelector('#timer').textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }, 250);
    log('simulator ready', navigator.userAgent);
  </script>
</body>
</html>
